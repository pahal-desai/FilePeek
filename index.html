<body>
    <div class="container">
        <div class="topbanner">
            <h1>FilePeek</h1>
            <p class="subtitle">Inspect, compare, sanitize, convert, and edit file headers, entropy, archives, and hex
                buffers</p>
        </div>

        <div class="urlloaderrow">
            <input type="text" id="urlinput" placeholder="Or inspect a public web URL (CORS supported)...">
            <button id="urlfetchbtn">Load URL</button>
        </div>

        <div id="dropZone">
            <div class="droptitle">Drop file here</div>
            <div class="dropsub">or click to browse</div>
        </div>

        <input type="file" id="fileInput">
        <input type="file" id="diffinputbox" style="display:none;">

        <div id="output">
            <div class="emptystate">No file loaded</div>
        </div>
    </div>

    <script type="module">
        const fileInput = document.getElementById('fileInput');
        const diffinputbox = document.getElementById('diffinputbox');
        const dropZone = document.getElementById('dropZone');
        const mainoutputbox = document.getElementById('output');
        const urltextbox = document.getElementById('urlinput');
        const fetchurlbutton = document.getElementById('urlfetchbtn');

        let thefilebullshit = null;
        let editswitchshit = false;
        let editdatabullshit = null;

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                thefilebullshit = file;
                editswitchshit = false;
                eatthisfilebullshit(file);
            }
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.classList.add('dragging');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragging');
        });

        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.classList.remove('dragging');
            const file = event.dataTransfer.files[0];
            if (file) {
                thefilebullshit = file;
                editswitchshit = false;
                eatthisfilebullshit(file);
            }
        });

        async function fetchRemoteFileUrl() {
            const url = urltextbox.value.trim();
            if (!url) return;
            fetchurlbutton.disabled = true;
            fetchurlbutton.textContent = 'Fetching...';
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const parts = url.split('/');
                const name = parts[parts.length - 1].split('?')[0] || 'remote_file';
                const file = new File([blob], name, { type: blob.type });
                thefilebullshit = file;
                editswitchshit = false;
                eatthisfilebullshit(file);
            } catch (err) {
                alert(`Failed to load URL: ${err.message}. Check CORS permissions.`);
            } finally {
                fetchurlbutton.disabled = false;
                fetchurlbutton.textContent = 'Load URL';
            }
        }
        if (fetchurlbutton && urltextbox) {
            fetchurlbutton.onclick = fetchRemoteFileUrl;
        }


        async function eatthisfilebullshit(file) {
            mainoutputbox.innerHTML = '<div class="emptystate">Analyzing file headers, entropy, and structures...</div>';

            try {
                const ext = gettheextshit(file.name);
                const mime = file.type || '';

                let topBarHtml = `
                    <div class="bar">
                        <div class="bar_info">
                            <span>${sanitizetextshit(file.name)}</span>
                            <span class="badgemode ${editswitchshit ? 'active' : ''}">${editswitchshit ? 'Edit Mode' : 'View Mode'}</span>
                        </div>
                        <div class="bar_btns">
                            <button id="comparefilebtn">Compare with File (Diff)</button>
                            <button id="toggleeditmodebtn" class="${editswitchshit ? '' : 'btnprimary'}">
                                ${editswitchshit ? 'Exit Edit Mode' : 'Edit Mode'}
                            </button>
                            ${editswitchshit ? `<button id="downloadeditedbtn" class="btnprimary">Save & Download</button>` : ''}
                        </div>
                    </div>
                    <div id="diffsectioncontainer"></div>
                `;

                const sections = [];
                const bufferHeader = await file.slice(0, 16).arrayBuffer();
                const magicInfo = sniffsignatureshit(new Uint8Array(bufferHeader), ext);

                sections.push(makebasicfileinfoshit(file, magicInfo));
                sections.push(makehashsectionshit(file));
                sections.push(await doentropyshit(file));
                sections.push(await makebase64shit(file));

                const isSvg = ext === 'svg' || mime === 'image/svg+xml';
                const isFont = ['ttf', 'otf', 'woff', 'woff2'].includes(ext) || mime.startsWith('font/');
                const isZip = (magicInfo?.detected && magicInfo.name.includes('ZIP')) || ['zip', 'jar', 'apk', 'docx', 'xlsx', 'pptx', 'epub'].includes(ext);
                const isImg = (magicInfo?.detected && magicInfo.name.includes('Image')) || mime.startsWith('image/') || ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'tiff', 'tif', 'heic', 'heif', 'avif'].includes(ext);
                const isPdf = (magicInfo?.detected && magicInfo.name.includes('PDF')) || mime === 'application/pdf' || ext === 'pdf';
                const isAudio = mime.startsWith('audio/') || ['mp3', 'wav', 'ogg', 'aac', 'flac', 'm4a', 'weba'].includes(ext);
                const isVideo = mime.startsWith('video/') || ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'flv'].includes(ext);
                const isHtml = mime === 'text/html' || ['html', 'htm', 'xhtml'].includes(ext);
                const isMd = mime === 'text/markdown' || ['md', 'markdown', 'mdown', 'mkd'].includes(ext);
                const isTable = ['csv', 'tsv'].includes(ext);
                const isJson = mime === 'application/json' || ext === 'json';
                const isTxt = mime.startsWith('text/') || mime === 'application/javascript' || mime === 'application/xml' || [
                    'txt', 'md', 'json', 'js', 'mjs', 'ts', 'jsx', 'tsx', 'html', 'htm', 'css',
                    'scss', 'less', 'xml', 'svg', 'csv', 'tsv', 'yaml', 'yml', 'ini', 'cfg',
                    'conf', 'env', 'sh', 'bat', 'cmd', 'ps1', 'py', 'rb', 'java', 'c', 'cpp',
                    'h', 'hpp', 'cs', 'go', 'rs', 'php', 'sql', 'log'
                ].includes(ext);

                if (isSvg) {
                    sections.push(await showsvgpreviewshit(file));
                } else if (isFont) {
                    sections.push(await setupfonttestershit(file));
                } else if (isZip) {
                    sections.push(await unpackziparchiveshit(file));
                } else if (isImg) {
                    sections.push(await showpicturestuffshit(file));
                } else if (isPdf) {
                    sections.push(await showpdfdocumentshit(file));
                } else if (isAudio) {
                    sections.push(await showaudiotrackshit(file));
                } else if (isVideo) {
                    sections.push(await showvideotrackshit(file));
                } else if (isHtml) {
                    sections.push(await showhtmlpreviewshit(file));
                } else if (isMd) {
                    sections.push(await showmarkdownpreviewshit(file));
                } else if (isTable) {
                    sections.push(await showcsvtableshit(file, ext));
                } else if (isJson) {

        function sniffsignatureshit(bytes, ext) {
            const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

            const signatures = [
                { hex: '89 50 4E 47 0D 0A 1A 0A', name: 'PNG Image', expected: ['png'] },
                { hex: 'FF D8 FF', name: 'JPEG Image', expected: ['jpg', 'jpeg'] },
                { hex: '47 49 46 38', name: 'GIF Image', expected: ['gif'] },
                { hex: '52 49 46 46', name: 'RIFF Container (WEBP/WAV/AVI)', expected: ['webp', 'wav', 'avi'] },
                { hex: '25 50 44 46', name: 'PDF Document', expected: ['pdf'] },
                { hex: '50 4B 03 04', name: 'ZIP Archive / Office Open XML', expected: ['zip', 'docx', 'xlsx', 'pptx', 'jar', 'apk', 'epub'] },
                { hex: '4D 5A', name: 'DOS MZ / PE Windows Executable', expected: ['exe', 'dll', 'sys', 'ocx'] },
                { hex: '7F 45 4C 46', name: 'ELF Executable / Linux Binary', expected: ['so', 'elf', 'bin', ''] },
                { hex: '1F 8B 08', name: 'GZIP Compressed Archive', expected: ['gz', 'tgz'] },
                { hex: '42 5A 68', name: 'BZIP2 Compressed Archive', expected: ['bz2'] },
                { hex: '75 73 74 61 72', name: 'TAR Archive', expected: ['tar'] },
                { hex: '37 7A BC AF 27 1C', name: '7-Zip Archive', expected: ['7z'] },
                { hex: '4F 67 67 53', name: 'OGG Multimedia Container', expected: ['ogg', 'oga', 'ogv'] },
                { hex: '1A 45 DF A3', name: 'Matroska / WebM Container', expected: ['mkv', 'webm'] },
                { hex: '49 44 33', name: 'MP3 Audio (ID3v2 tag)', expected: ['mp3'] },
                { hex: '77 4F 46 46', name: 'WOFF Font', expected: ['woff'] },
                { hex: '77 4F 46 32', name: 'WOFF2 Font', expected: ['woff2'] },
                { hex: '00 01 00 00', name: 'TrueType Font', expected: ['ttf'] },
                { hex: '4F 54 54 4F', name: 'OpenType Font', expected: ['otf'] }
            ];

            for (const sig of signatures) {
                const sigBytes = sig.hex.split(' ');
                let match = true;
                for (let i = 0; i < sigBytes.length; i++) {
                    if (bytes[i] !== parseInt(sigBytes[i], 16)) {

                if (match) {

                    return {

            }

                matchesExt: true,
                detected: false
            };
        }

        async function doentropyshit(file) {
            const scanLimit = Math.min(file.size, 65536);
            const sliceBuffer = await file.slice(0, scanLimit).arrayBuffer();
            const bytes = new Uint8Array(sliceBuffer);

            const counts = new Uint32Array(256);
            for (let i = 0; i < bytes.length; i++) {
                counts[bytes[i]]++;
            }

            let entropy = 0;
            const len = bytes.length;
            if (len > 0) {
                for (let i = 0; i < 256; i++) {
                    if (counts[i] > 0) {
                        const p = counts[i] / len;
                        entropy -= p * Math.log2(p);
                    }
                }
            }

            let entropyCategory = 'Normal Text/Code (3.5 - 5.5)';
            if (entropy > 7.5) {
                entropyCategory = 'Dense / Compressed';
            } else if (entropy < 3.0) {
                entropyCategory = 'Sparse / Repetitive';
            }

            setTimeout(() => {
                const canvas = document.getElementById('entropyhistogramcanvas');
                if (canvas && len > 0) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    let maxCount = 0;
                    for (let i = 0; i < 256; i++) {
                        if (counts[i] > maxCount) maxCount = counts[i];
                    }

                    const bw = canvas.width / 256;
                    for (let i = 0; i < 256; i++) {
                        const h = (counts[i] / maxCount) * canvas.height;
                        ctx.fillStyle = '#4f75ff';
                        ctx.fillRect(i * bw, canvas.height - h, bw, h);
                    }
                }
            }, 0);

            return `
                <div class="sectionblock">
                    <div class="sectionheaderrow">
                        <div class="sectionheader">Entropy & Byte Spread</div>
                    </div>
                    <div class="tablewrap">
                        <table>

                                    <td class="cellkey">Assessment</td>
                                    <td class="cellval">${sanitizetextshit(entropyCategory)}</td>
                                </tr>
                            </tbody>
                        </table>

                    <div class="subheader">Byte Value Frequency Histogram (0x00 to 0xFF)</div>
                    <canvas id="entropyhistogramcanvas" class="darkcanvas" width="512" height="64"></canvas>
                </div>
            `;
        }

        function pullcolorpaletteshit(data, numColors) {
            const colorCounts = {};
            for (let i = 0; i < data.length; i += 16) {
                const r = Math.round(data[i] / 32) * 32;
                const g = Math.round(data[i + 1] / 32) * 32;
                const b = Math.round(data[i + 2] / 32) * 32;
                const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
                colorCounts[hex] = (colorCounts[hex] || 0) + 1;
            }
            return Object.keys(colorCounts).sort((a, b) => colorCounts[b] - colorCounts[a]).slice(0, numColors);
        }

        function drawaudiowaveformshit(canvas, rawData) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const step = Math.ceil(rawData.length / canvas.width);
            const amp = canvas.height / 2;
            ctx.fillStyle = '#4f75ff';
            for (let i = 0; i < canvas.width; i++) {
                let min = 1.0, max = -1.0;
                const base = i * step;
                for (let j = 0; j < step; j++) {
                    const d = rawData[base + j];
                    if (d < min) min = d;
                    if (d > max) max = d;
                }
                ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
            }
        }

                        });
                    }
                }, 0);
            } else {
                html += `
                    <div class="subheader">Formatted View</div>
                    <pre>${sanitizetextshit(formattedJson)}</pre>
                `;
            }

            html += `</div>`;
            return html;
        }

        async function showplaintextshit(file) {
            const fullText = await file.text();
            editdatabullshit = { type: 'text', content: fullText };

            let html = `
                <div class="sectionblock">
                    <div class="sectionheaderrow">
                        <div class="sectionheader">Plain Text</div>
                    </div>
                    <div class="tablewrap">
                        <table>
                            <tbody>
                                <tr>
                                    <td class="cellkey">Characters</td>
                                    <td class="cellval" id="textcharcount">${fullText.length.toLocaleString()}</td>
                                </tr>
                                <tr>
                                    <td class="cellkey">Lines</td>
                                    <td class="cellval" id="textlinecount">${fullText.split(/\r\n|\r|\n/).length.toLocaleString()}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
            `;

            if (editswitchshit) {
                html += `
                    <div class="subheader">Text Editor</div>
                    <textarea id="texteditorinput" class="editortextarea" spellcheck="false">${sanitizetextshit(fullText)}</textarea>
                `;

                setTimeout(() => {
                    const textarea = document.getElementById('texteditorinput');
                    const charCount = document.getElementById('textcharcount');
                    const lineCount = document.getElementById('textlinecount');

                    if (textarea) {
                        textarea.addEventListener('input', () => {
                            const val = textarea.value;
                            editdatabullshit.content = val;
                            if (charCount) charCount.textContent = val.length.toLocaleString();
                            if (lineCount) lineCount.textContent = val.split(/\r\n|\r|\n/).length.toLocaleString();
                        });
                    }
                }, 0);
            } else {
                const maxChars = 150000;
                const isTruncated = fullText.length > maxChars;
                const displayText = isTruncated ? fullText.substring(0, maxChars) : fullText;

                html += `
                    <div class="subheader">Preview${isTruncated ? ' (Truncated)' : ''}</div>
                    <pre>${sanitizetextshit(displayText)}</pre>
                `;
            }

            html += `</div>`;
            return html;
        }


        function extractasciistringsshit(bytes) {
            let out = [], curr = '';
            for (let i = 0; i < bytes.length; i++) {
                const b = bytes[i];
                if (b >= 32 && b <= 126) {
                    curr += String.fromCharCode(b);
                } else {
                    if (curr.length >= 4) out.push(curr);
                    curr = '';
                }
            }
            if (curr.length >= 4) out.push(curr);
            return out;
        }

        function hookbinaryinspectionshit(file, initialBytes) {
            const searchBtn = document.getElementById('hexsearchbtn');
            const searchInput = document.getElementById('hexsearchinput');
            const stringsBtn = document.getElementById('extractstringsbtn');
            const previewTextBtn = document.getElementById('previewtextbtn');
            const subview = document.getElementById('binarysubviewcontainer');
            const hexOutput = document.getElementById('hexoutput');
            const seeMoreBtn = document.getElementById('seemorehexbtn');
            const loadAllBtn = document.getElementById('loadallhexbtn');
            const hexCount = document.getElementById('hexcount');
            const hexControls = document.getElementById('hexcontrols');

            if (searchBtn && searchInput && hexOutput) {
                searchBtn.onclick = () => {
                    const q = searchInput.value.trim();
                    if (!q) return;
                    const reg = new RegExp(`(${q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')})`, 'gi');
                    hexOutput.innerHTML = sanitizetextshit(hexOutput.textContent).replace(reg, '<mark class="searchhighlight">$1</mark>');
                };
            }

            if (stringsBtn && subview) {
                stringsBtn.onclick = async () => {
                    stringsBtn.disabled = true;
                    subview.innerHTML = '<div class="emptystate">Extracting strings...</div>';
                    try {
                        const limit = Math.min(file.size, 800 * 1024);
                        const buf = await file.slice(0, limit).arrayBuffer();
                        const strList = extractasciistringsshit(new Uint8Array(buf));
                        subview.innerHTML = `
                            <div class="subheader">Printable Strings (Minimum 4 characters, scanned up to 800 KB)</div>
                            <pre style="max-height: 240px;">${sanitizetextshit(strList.slice(0, 500).join('\n'))}</pre>
                        `;
                    } catch (err) {
                        subview.innerHTML = `<div class="errorstate">Extraction failed: ${sanitizetextshit(err.message)}</div>`;
                    } finally {
                        stringsBtn.disabled = false;
                    }
                };
            }

            if (previewTextBtn && subview) {
                previewTextBtn.onclick = async () => {
                    previewTextBtn.disabled = true;
                    subview.innerHTML = '<div class="emptystate">Decoding...</div>';
                    try {
                        const fullText = await file.text();
                        const isTruncated = fullText.length > 150000;
                        const txt = isTruncated ? fullText.substring(0, 150000) : fullText;
                        subview.innerHTML = `
                            <div class="subheader">Decoded Text${isTruncated ? ' (Truncated)' : ''}</div>
                            <pre>${sanitizetextshit(txt)}</pre>
                        `;
                    } catch (err) {
                        subview.innerHTML = `<div class="errorstate">Failed to decode: ${sanitizetextshit(err.message)}</div>`;
                    } finally {
                        previewTextBtn.disabled = false;
                    }
                };
            }

            if (file.size > initialBytes) {
                let currOffset = initialBytes;
                if (seeMoreBtn) {
                    seeMoreBtn.onclick = async () => {
                        seeMoreBtn.disabled = true;
                        const nextOffset = Math.min(file.size, currOffset + 4096);
                        const chunkBuf = await file.slice(currOffset, nextOffset).arrayBuffer();
                        hexOutput.textContent += '\n' + dumphexshit(chunkBuf, currOffset);
                        currOffset = nextOffset;
                        if (hexCount) hexCount.textContent = currOffset;
                        seeMoreBtn.disabled = false;
                        if (currOffset >= file.size && hexControls) {
                            hexControls.innerHTML = '<div class="emptystate">Complete binary dump loaded</div>';
                        }
                    };
                }
                if (loadAllBtn) {
                    loadAllBtn.onclick = async () => {
                        loadAllBtn.disabled = true;
                        if (seeMoreBtn) seeMoreBtn.disabled = true;
                        loadAllBtn.textContent = 'Loading...';
                        const fullBuf = await file.slice(currOffset).arrayBuffer();
                        hexOutput.textContent += '\n' + dumphexshit(fullBuf, currOffset);
                        currOffset = file.size;
                        if (hexCount) hexCount.textContent = file.size.toLocaleString();
                        if (hexControls) {
                            hexControls.innerHTML = '<div class="emptystate">Complete binary dump loaded</div>';
                        }
                    };
                }
            }
        }

        async function showrawbinaryshit(file) {
            if (editswitchshit) {
                return `
                    <div class="sectionblock">
                        <div class="sectionheaderrow">
                            <div class="sectionheader">Hex View</div>
                        </div>
                        ${await hexgridbuildingshit(file)}
                    </div>
                `;
            }

            const initialBytes = 512;
            const slice = file.slice(0, initialBytes);
            const buffer = await slice.arrayBuffer();
            const hexText = dumphexshit(buffer, 0);

            let html = `
                <div class="sectionblock">
                    <div class="sectionheaderrow">
                        <div class="sectionheader">Raw Hex & Strings</div>
                    </div>
                    <div class="btnrow">
                        <input type="text" id="hexsearchinput" placeholder="Search text or hex pattern...">
                        <button id="hexsearchbtn">Find</button>
                        <button id="extractstringsbtn">Extract Printable Strings</button>
                        <button id="previewtextbtn">Decode as UTF-8</button>
                    </div>
                    <div id="binarysubviewcontainer"></div>
                    <div class="subheader">Hex Dump (<span id="hexcount">${Math.min(file.size, initialBytes)}</span> / ${file.size.toLocaleString()} bytes)</div>
                    <pre id="hexoutput">${sanitizetextshit(hexText)}</pre>
            `;

            if (file.size > initialBytes) {
                html += `
                    <div class="btnrow" id="hexcontrols">
                        <button id="seemorehexbtn">Next 4 KB</button>
                        <button id="loadallhexbtn">Load All</button>
                    </div>
                `;
            }

            html += `</div>`;

            setTimeout(() => hookbinaryinspectionshit(file, initialBytes), 0);

            return html;
        }

        function handlehexinputchangeshit(e, bytes, displayLimit) {
            const idx = parseInt(e.target.dataset.index, 10);
            let parsed = parseInt(e.target.value.trim(), 16);
            if (isNaN(parsed) || parsed < 0 || parsed > 255) parsed = bytes[idx];
            bytes[idx] = parsed;
            e.target.value = parsed.toString(16).padStart(2, '0').toUpperCase();

            const rowStart = Math.floor(idx / 16) * 16;
            const asciiElem = document.getElementById(`hexasciirow${rowStart}`);
            if (!asciiElem) return;
            let asciiStr = '';
            for (let k = 0; k < 16; k++) {
                const currIdx = rowStart + k;
                if (currIdx < displayLimit) {
                    const b = bytes[currIdx];
                    asciiStr += (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.';
                }
            }
            asciiElem.textContent = asciiStr;
        }

        function handlehexinputkeynavshit(e, input) {
            if (e.key === 'ArrowRight' && input.selectionStart === input.value.length) {
                const next = input.nextElementSibling || input.closest('tr')?.nextElementSibling?.querySelector('.hexbyteinput');
                if (next) { next.focus(); next.select(); }
            } else if (e.key === 'ArrowLeft' && input.selectionStart === 0) {
                const prev = input.previousElementSibling || input.closest('tr')?.previousElementSibling?.querySelectorAll('.hexbyteinput');
                if (prev) {
                    const target = prev.length ? prev[prev.length - 1] : prev;
                    target.focus(); target.select();
                }
            }
        }

        async function hexgridbuildingshit(file) {
            const buffer = await file.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            editdatabullshit = { type: 'binary', bytes: bytes };

            const displayLimit = Math.min(bytes.length, 1280);

            let tableRows = '';
            for (let i = 0; i < displayLimit; i += 16) {
                const offset = i.toString(16).padStart(8, '0');
                let inputsHtml = '';
                let asciiRow = '';

                for (let j = 0; j < 16; j++) {
                    const idx = i + j;
                    if (idx < displayLimit) {
                        const b = bytes[idx];
                        const hexVal = b.toString(16).padStart(2, '0').toUpperCase();
                        inputsHtml += `<input type="text" maxlength="2" class="hexbyteinput" data-index="${idx}" value="${hexVal}">`;
                        asciiRow += (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.';
                    } else {
                        inputsHtml += `<span style="display:inline-block;width:24px;"></span>`;
                    }
                }

                tableRows += `
                    <tr>
                        <td class="hexoffsetcol">${offset}</td>
                        <td><div class="hexbytescol">${inputsHtml}</div></td>
                        <td class="hexasciicol" id="hexasciirow${i}">${sanitizetextshit(asciiRow)}</td>
                    </tr>
                `;
            }

            setTimeout(() => {
                document.querySelectorAll('.hexbyteinput').forEach(input => {
                    input.onchange = (e) => handlehexinputchangeshit(e, bytes, displayLimit);
                    input.onkeydown = (e) => handlehexinputkeynavshit(e, input);
                });
            }, 0);

            return `
                <div class="subheader">Hex Editor (${displayLimit.toLocaleString()} of ${bytes.length.toLocaleString()} bytes loaded)</div>
                <div class="tablewrap">
                    <table class="hexeditortable">
                        <thead>
                            <tr>
                                <th>Offset</th>
                                <th>Bytes (Hex)</th>
                                <th>ASCII</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function dumphexshit(buffer, startOffset) {
            const bytes = new Uint8Array(buffer);
            let rows = [];

            for (let i = 0; i < bytes.length; i += 16) {
                const offset = (startOffset + i).toString(16).padStart(8, '0');
                let h = [];
                let a = [];

                for (let j = 0; j < 16; j++) {
                    if (i + j < bytes.length) {
                        const b = bytes[i + j];
                        h.push(b.toString(16).padStart(2, '0'));
                        a.push(b >= 32 && b <= 126 ? String.fromCharCode(b) : '.');
                    } else {
                        h.push('  ');
                        a.push(' ');
                    }
                }

                rows.push(`${offset}  ${h.slice(0, 8).join(' ')}  ${h.slice(8).join(' ')}  |${a.join('')}|`);
            }

            return rows.join('\n');
        }

        function sanitizetextshit(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
